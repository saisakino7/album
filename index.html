<head>
<meta charset="utf-8">

<title>SOUNDS OF MENGMAOLONE · SAISAKI</title>
<meta name="description" content="SOUNDS OF MENGMAOLONE — the new album by SAISAKI. 全新专辑现已上线。">
<meta property="og:title" content="SOUNDS OF MENGMAOLONE · SAISAKI">

<style>
:root{
  --bg:#FFFFFF; --bg-alt:#F5F5F7; --group:#FFFFFF;
  --text:#1D1D1F; --text-2:#6E6E73; --sep:rgba(0,0,0,.09);
  --sun:#C8402F; --sun-hover:#B23726; --on-sun:#FFFFFF;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  background:var(--bg);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --bg-alt:#101012; --group:#1C1C1E;
    --text:#F5F5F7; --text-2:#A1A1A6; --sep:rgba(255,255,255,.1);
    --sun:#E0533F; --sun-hover:#EA6450;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --bg-alt:#101012; --group:#1C1C1E;
  --text:#F5F5F7; --text-2:#A1A1A6; --sep:rgba(255,255,255,.1);
  --sun:#E0533F; --sun-hover:#EA6450;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","PingFang SC","Hiragino Sans GB","Noto Sans SC","Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  font-size:17px; line-height:1.5;
}
img{max-width:100%; display:block}

/* 语言切换 */
.topbar{display:flex; justify-content:flex-end; padding:14px 16px 0; max-width:1240px; margin:0 auto}
.lang{display:inline-flex; padding:3px; border-radius:980px; background:var(--bg-alt)}
.lang button{
  appearance:none; border:0; background:transparent; color:var(--text-2);
  font:inherit; font-size:13px; font-weight:500; padding:5px 12px; border-radius:980px; cursor:pointer;
}
.lang button[aria-pressed="true"]{background:var(--group); color:var(--text); box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* Hero */
.hero{text-align:center; padding:40px 20px 0}
.artist{margin:0; font-size:19px; font-weight:600; letter-spacing:.01em; color:var(--text-2)}
h1{
  margin:6px auto 0; max-width:12ch;
  font-size:clamp(40px,11.5vw,88px); font-weight:700;
  line-height:1.02; letter-spacing:-.025em;
}
.status{margin:18px 0 0; font-size:17px; color:var(--text-2)}
.cta{
  display:inline-block; margin-top:22px; padding:12px 24px;
  border-radius:980px; background:var(--sun); color:var(--on-sun);
  font-size:17px; font-weight:500; text-decoration:none;
}
.art{margin:44px auto 0; max-width:1100px; padding:0 16px}
.art img{
  width:100%; aspect-ratio:4/3; object-fit:cover; border-radius:22px;
  animation:settle 1.6s cubic-bezier(.2,.7,.2,1) both;
}
@keyframes settle{from{opacity:0; transform:scale(1.04)}to{opacity:1; transform:none}}

/* 简介 */
.about{max-width:680px; margin:0 auto; padding:88px 24px 80px}
.statement{margin:0; font-size:clamp(30px,7.4vw,48px); font-weight:700; line-height:1.12; letter-spacing:-.02em}
.about p.body{margin:24px 0 0; font-size:19px; line-height:1.65; color:var(--text-2)}
.about p.body strong{color:var(--text); font-weight:600}

/* 收听 */
.listen{background:var(--bg-alt); padding:72px 16px 88px}
.listen .inner{max-width:560px; margin:0 auto}
h2{margin:0 8px 22px; font-size:clamp(28px,6.6vw,40px); font-weight:700; letter-spacing:-.02em; line-height:1.1}
.group{list-style:none; margin:0; padding:0; background:var(--group); border-radius:18px; overflow:hidden}
.group li + li .row-in{border-top:1px solid var(--sep)}
.row{display:block; padding-left:18px; color:inherit; text-decoration:none}
.row:active{background:var(--sep)}
.row-in{display:flex; align-items:center; gap:14px; padding:14px 18px 14px 0; min-height:62px}
.icon{width:34px; height:34px; border-radius:8px; object-fit:contain; flex:none}
.dot{width:34px; height:34px; border-radius:8px; flex:none; opacity:.9}
.name{flex:1; font-size:17px; font-weight:500}
.hint{font-size:15px; color:var(--text-2)}
.chev{width:8px; height:13px; flex:none; color:var(--text-2); opacity:.6}
.off{opacity:.45; pointer-events:none}

.tg{margin-top:28px; padding:26px 22px; border-radius:18px; background:var(--group); display:flex; align-items:center; gap:16px; flex-wrap:wrap}
.tg-text{flex:1 1 220px}
.tg h3{margin:0; font-size:21px; font-weight:700; letter-spacing:-.01em}
.tg p{margin:4px 0 0; font-size:15px; color:var(--text-2)}
.tg a{padding:10px 20px; border-radius:980px; background:var(--sun); color:var(--on-sun); font-size:15px; font-weight:500; text-decoration:none; white-space:nowrap}
.tg a.off{background:var(--sep); color:var(--text-2)}

footer{padding:28px 20px 36px; text-align:center; font-size:12px; color:var(--text-2); background:var(--bg-alt); border-top:1px solid var(--sep)}

a:focus-visible,button:focus-visible{outline:2px solid var(--sun); outline-offset:3px; border-radius:10px}
@media (prefers-reduced-motion:reduce){.art img{animation:none}}

@media (min-width:740px){
  .hero{padding-top:64px}
  .art{padding:0 24px}
  .topbar{padding:18px 24px 0}
}
/* 电脑版 */
@media (min-width:1024px){
  .topbar{padding:22px 40px 0}
  .hero{padding-top:88px}
  .artist{font-size:21px}
  h1{font-size:clamp(72px,7.4vw,108px)}
  .status{font-size:21px; margin-top:22px}
  .cta{margin-top:28px; padding:14px 30px}
  .art{max-width:1240px; margin-top:72px; padding:0 40px}
  .art img{border-radius:30px}
  .duo{
    display:grid; grid-template-columns:1.15fr 1fr; gap:88px; align-items:start;
    background:var(--bg-alt); margin-top:120px;
    padding:120px max(40px, calc((100% - 1160px) / 2)) 136px;
  }
  .about{padding:0; max-width:none; position:sticky; top:56px}
  .statement{font-size:clamp(48px,4.6vw,64px)}
  .about p.body{font-size:21px; margin-top:28px; max-width:30em}
  .listen{background:transparent; padding:0}
  .listen .inner{max-width:none}
  h2{margin:0 0 24px; font-size:32px}
  .row-in{min-height:68px}
  .row:hover{background:var(--sep)}
  .cta:hover,.tg a:hover{background:var(--sun-hover)}
  .tg a.off:hover{background:var(--sep)}
  footer{border-top:none}
}
</style>

  { zh:"YouTube",     en:"YouTube",            url:"", icon:"icons/youtube.png",    color:"#FF4B3E" },
  { zh:"汽水音乐",    en:"Soda Music",         url:"", icon:"icons/qishui.png",     color:"#3D7BFF" },
  { zh:"Apple Music", en:"Apple Music",        url:"", icon:"icons/applemusic.png", color:"#FA5C70" },
  { zh:"QQ 音乐",     en:"QQ Music",           url:"", icon:"icons/qqmusic.png",    color:"#31C27C" }
];
const TELEGRAM = "";   // 例如 https://t.me/你的群组

/* 文案：中文 / 英文 */
const TEXT = {
  zh: {
    status:"全新专辑 · 现已上线",
    cta:"立即收听",
    statement:"一轮落日，<br>照着整个勐卯。",
    intro:"十二首歌，十二种落日的颜色。<strong>SAISAKI</strong> 把傣族老调、象脚鼓和葫芦丝，放进今天的说唱节拍里。不翻唱旧歌，而是从故乡出发，用这一代人的语言，把勐卯重新讲一遍。",
    listenTitle:"选择平台收听",
    soon:"即将上线",
    tgTitle:"Telegram 粉丝群",
    tgSub:"在群里下载整张专辑的离线 MP3。",
    tgJoin:"加入群组",
    tgSoon:"即将开放",
    alt:"专辑封面：落日下眺望佛塔与河流的背影",
    rights:"保留所有权利。"
  },
  en: {
    status:"New album · Out now",
    cta:"Listen now",
    statement:"One sunset,<br>over all of Mengmao.",
    intro:"Twelve songs, twelve colors of the setting sun. <strong>SAISAKI</strong> carries old Dai melodies, the elephant-foot drum and the hulusi into the rhythm of modern rap. Not a cover of the old songs, but Mengmao told again, from home, in the language of this generation.",
    listenTitle:"Choose your platform",
    soon:"Coming soon",
    tgTitle:"Telegram fan group",
    tgSub:"Download the full album as offline MP3s in the group.",
    tgJoin:"Join the group",
    tgSoon:"Opening soon",
    alt:"Album cover: a figure watching the sun set over pagodas and a river",
    rights:"All rights reserved."
  }
};
/* =============================================== */

/* 中国大陆时区或简体中文系统 → 中文；其他 → 英文。
   手动切换后会记住；链接末尾加 #zh 或 #en 可强制语言。 */
function detectLang(){
  const h = location.hash.slice(1);
  if (h === "zh" || h === "en") return h;
  try { const s = localStorage.getItem("lang"); if (s === "zh" || s === "en") return s; } catch(e){}
  let tz = "";
  try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch(e){}
  if (["Asia/Shanghai","Asia/Chongqing","Asia/Chungking","Asia/Harbin","Asia/Urumqi","Asia/Kashgar","PRC"].includes(tz)) return "zh";
  const l = ((navigator.languages && navigator.languages[0]) || navigator.language || "").toLowerCase();
  if (l === "zh-cn" || l.startsWith("zh-hans")) return "zh";
  return "en";
}

const chev = '<svg class="chev" viewBox="0 0 8 13" fill="none" aria-hidden="true"><path d="M1.5 1.5 6.5 6.5 1.5 11.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function render(lang){
  const T = TEXT[lang];
  document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
  document.title = ALBUM + " · " + ARTIST;
  document.getElementById("album").textContent = ALBUM;
  document.getElementById("artist").textContent = ARTIST;
  document.getElementById("cover").alt = T.alt;
  document.querySelectorAll("[data-t]").forEach(el => { el.innerHTML = T[el.dataset.t]; });
  document.getElementById("foot").textContent = "© " + new Date().getFullYear() + " " + ARTIST + ". " + T.rights;

  const ul = document.getElementById("links");
  ul.innerHTML = "";
  LINKS.forEach(l => {
    const li = document.createElement("li");
    const a = document.createElement("a");
    a.className = "row" + (l.url ? "" : " off");
    if (l.url) { a.href = l.url; a.target = "_blank"; a.rel = "noopener"; }
    a.innerHTML = '<div class="row-in"><i class="dot"></i><span class="name"></span><span class="hint"></span>' + chev + '</div>';
    const dot = a.querySelector(".dot");
    dot.style.background = l.color;
    a.querySelector(".name").textContent = l[lang];
    a.querySelector(".hint").textContent = l.url ? "" : T.soon;
    if (l.icon) {
      const img = new Image(); img.className = "icon"; img.alt = "";
      img.onload = () => dot.replaceWith(img); img.src = l.icon;
    }
    li.appendChild(a); ul.appendChild(li);
  });

  const btn = document.getElementById("tg-btn");
  if (TELEGRAM) { btn.href = TELEGRAM; btn.target = "_blank"; btn.rel = "noopener"; btn.className = ""; btn.textContent = T.tgJoin; }
  else { btn.removeAttribute("href"); btn.className = "off"; btn.textContent = T.tgSoon; }

  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
}

document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => {
  try { localStorage.setItem("lang", b.dataset.lang); } catch(e){}
  render(b.dataset.lang);
}));
window.addEventListener("hashchange", () => {
  const h = location.hash.slice(1);
  if (h === "zh" || h === "en") render(h);
});

render(detectLang());
</script>
