<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SOUNDS OF MENGMAOLONE · SAISAKI</title>
<meta name="description" content="SOUNDS OF MENGMAOLONE — the new album by SAISAKI. 全新专辑现已上线。">
<meta property="og:title" content="SOUNDS OF MENGMAOLONE · SAISAKI">
<meta property="og:image" content="https://saisakino7.github.io/album/cover.jpg">
<meta property="og:url" content="https://saisakino7.github.io/album/">
<style>
:root{
  --bg:#FFFFFF; --bg-alt:#F5F5F7; --group:#FFFFFF;
  --text:#1D1D1F; --text-2:#6E6E73; --sep:rgba(0,0,0,.09);
  --sun:#C8402F; --sun-hover:#B23726; --on-sun:#FFFFFF; --pip-track:rgba(0,0,0,.16);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  background:var(--bg);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --bg-alt:#101012; --group:#1C1C1E;
    --text:#F5F5F7; --text-2:#A1A1A6; --sep:rgba(255,255,255,.1);
    --sun:#E0533F; --sun-hover:#EA6450; --pip-track:rgba(255,255,255,.22);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --bg-alt:#101012; --group:#1C1C1E;
  --text:#F5F5F7; --text-2:#A1A1A6; --sep:rgba(255,255,255,.1);
  --sun:#E0533F; --sun-hover:#EA6450; --pip-track:rgba(255,255,255,.22);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","PingFang SC","Hiragino Sans GB","Noto Sans SC","Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  font-size:17px; line-height:1.5;
}
img{max-width:100%; display:block}

/* 语言切换 */
.topbar{display:flex; justify-content:flex-end; padding:14px 16px 0; max-width:1240px; margin:0 auto}
.lang{display:inline-flex; padding:3px; border-radius:980px; background:var(--bg-alt)}
.lang button{
  appearance:none; border:0; background:transparent; color:var(--text-2);
  font:inherit; font-size:13px; font-weight:500; padding:5px 12px; border-radius:980px; cursor:pointer;
}
.lang button[aria-pressed="true"]{background:var(--group); color:var(--text); box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* Hero */
.hero{text-align:center; padding:40px 20px 0}
.artist{margin:0; font-size:19px; font-weight:600; letter-spacing:.01em; color:var(--text-2)}
h1{
  margin:6px auto 0; max-width:12ch;
  font-size:clamp(40px,11.5vw,88px); font-weight:700;
  line-height:1.02; letter-spacing:-.025em;
}
.status{margin:18px 0 0; font-size:17px; color:var(--text-2)}
.cta{
  display:inline-block; margin-top:22px; padding:12px 24px;
  border-radius:980px; background:var(--sun); color:var(--on-sun);
  font-size:17px; font-weight:500; text-decoration:none;
}
.art{margin:44px auto 0; max-width:1100px; padding:0 16px}
.gallery{
  position:relative; overflow:hidden; border-radius:22px; touch-action:pan-y;
  animation:settle 1.6s cubic-bezier(.2,.7,.2,1) both;
}
.track{display:flex; transition:transform .9s cubic-bezier(.65,0,.35,1)}
.slide{flex:0 0 100%; margin:0}
.slide img{width:100%; height:auto; aspect-ratio:10/9; object-fit:cover; -webkit-user-drag:none; user-select:none}
.g-ctrl{display:flex; justify-content:center; align-items:center; gap:12px; margin-top:22px}
.pips{display:flex; align-items:center; gap:10px; height:44px; padding:0 18px; border-radius:980px; background:var(--bg-alt)}
.pip{
  appearance:none; border:0; padding:0; cursor:pointer; position:relative; overflow:hidden;
  width:8px; height:8px; border-radius:980px; background:var(--text-2); opacity:.5;
  transition:width .5s cubic-bezier(.65,0,.35,1), opacity .3s;
}
.pip.on{width:44px; opacity:1; background:var(--pip-track)}
.pip i{position:absolute; inset:0; border-radius:inherit; background:var(--text); transform:scaleX(0); transform-origin:left}
.pip.on i{animation:fill var(--dur,5s) linear forwards}
.gallery-wrap.paused .pip.on i{animation-play-state:paused}
.gallery-wrap.still .pip.on i{animation:none; transform:none}
@keyframes fill{to{transform:none}}
.pp{
  appearance:none; border:0; cursor:pointer; width:44px; height:44px; border-radius:50%;
  display:grid; place-items:center; background:var(--bg-alt); color:var(--text);
}
.pp svg{width:14px; height:14px}
.pp .i-play{display:none}
.gallery-wrap.paused .pp .i-play,.gallery-wrap.still .pp .i-play{display:block}
.gallery-wrap.paused .pp .i-pause,.gallery-wrap.still .pp .i-pause{display:none}
@keyframes settle{from{opacity:0; transform:scale(1.04)}to{opacity:1; transform:none}}

/* 简介 */
.about{max-width:680px; margin:0 auto; padding:88px 24px 80px}
.statement{margin:0; font-size:clamp(22px,7vw,40px); font-weight:700; line-height:1.12; letter-spacing:-.02em}
.about p.body{margin:24px 0 0; font-size:19px; line-height:1.65; color:var(--text-2)}
.about p.body strong{color:var(--text); font-weight:600}

/* 收听 */
.listen{background:var(--bg-alt); padding:72px 16px 88px}
.listen .inner{max-width:560px; margin:0 auto}
h2{margin:0 8px 22px; font-size:clamp(28px,6.6vw,40px); font-weight:700; letter-spacing:-.02em; line-height:1.1}
.group{list-style:none; margin:0; padding:0; background:var(--group); border-radius:18px; overflow:hidden}
.group li + li .row-in{border-top:1px solid var(--sep)}
.row{display:block; padding-left:18px; color:inherit; text-decoration:none}
.row:active{background:var(--sep)}
.row-in{display:flex; align-items:center; gap:14px; padding:14px 18px 14px 0; min-height:62px}
.icon{width:34px; height:34px; border-radius:8px; object-fit:contain; flex:none}
.dot{width:34px; height:34px; border-radius:8px; flex:none; opacity:.9}
.name{flex:1; font-size:17px; font-weight:500}
.hint{font-size:15px; color:var(--text-2)}
.chev{width:8px; height:13px; flex:none; color:var(--text-2); opacity:.6}
.off{opacity:.45; pointer-events:none}


footer{padding:28px 20px 36px; text-align:center; font-size:12px; color:var(--text-2); background:var(--bg-alt); border-top:1px solid var(--sep)}

a:focus-visible,button:focus-visible{outline:2px solid var(--sun); outline-offset:3px; border-radius:10px}
@media (prefers-reduced-motion:reduce){.gallery{animation:none}.track{transition:none}.pip{transition:none}}

@media (min-width:740px){
  .hero{padding-top:64px}
  .art{padding:0 24px}
  .topbar{padding:18px 24px 0}
}
/* 电脑版 */
@media (min-width:1024px){
  .topbar{padding:22px 40px 0}
  .hero{padding-top:88px}
  .artist{font-size:21px}
  h1{font-size:clamp(72px,7.4vw,108px)}
  .status{font-size:21px; margin-top:22px}
  .cta{margin-top:28px; padding:14px 30px}
  .art{max-width:1240px; margin-top:72px; padding:0 40px}
  .gallery{border-radius:30px}
  .pp:hover,.pips:hover{filter:brightness(.96)}
  .duo{
    display:grid; grid-template-columns:1.15fr 1fr; gap:88px; align-items:start;
    background:var(--bg-alt); margin-top:120px;
    padding:120px max(40px, calc((100% - 1160px) / 2)) 136px;
  }
  .about{padding:0; max-width:none; position:sticky; top:56px}
  .statement{font-size:clamp(36px,3.3vw,46px)}
  .about p.body{font-size:21px; margin-top:28px; max-width:30em}
  .listen{background:transparent; padding:0}
  .listen .inner{max-width:none}
  h2{margin:0 0 24px; font-size:32px}
  .row-in{min-height:68px}
  .row:hover{background:var(--sep)}
  .cta:hover{background:var(--sun-hover)}
  footer{border-top:none}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="lang" role="group" aria-label="Language">
    <button type="button" data-lang="zh">中文</button>
    <button type="button" data-lang="en">EN</button>
  </div>
</div>

<header class="hero">
  <p class="artist" id="artist">SAISAKI</p>
  <h1 id="album">SOUNDS OF MENGMAOLONE</h1>
  <p class="status" data-t="status"></p>
  <a class="cta" href="#listen" data-t="cta"></a>
</header>

<div class="art gallery-wrap" id="gallery-wrap">
  <div class="gallery" id="gallery" aria-roledescription="carousel">
    <div class="track" id="track">
      <figure class="slide"><img src="covers/front.webp" width="2000" height="1800" alt="" fetchpriority="high"></figure>
      <figure class="slide"><img src="covers/back.webp" width="2000" height="1800" alt="" decoding="async"></figure>
    </div>
  </div>
  <div class="g-ctrl">
    <div class="pips" id="pips"></div>
    <button type="button" class="pp" id="pp">
      <svg class="i-pause" viewBox="0 0 14 14" aria-hidden="true"><rect x="2" y="1" width="3.4" height="12" rx="1" fill="currentColor"/><rect x="8.6" y="1" width="3.4" height="12" rx="1" fill="currentColor"/></svg>
      <svg class="i-play" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 1.6v10.8a.8.8 0 0 0 1.2.7l9-5.4a.8.8 0 0 0 0-1.4l-9-5.4A.8.8 0 0 0 3 1.6Z" fill="currentColor"/></svg>
    </button>
  </div>
</div>

<div class="duo">
<section class="about">
  <p class="statement" data-t="statement"></p>
  <p class="body" data-t="intro"></p>
</section>

<section class="listen" id="listen">
  <div class="inner">
    <h2 data-t="listenTitle"></h2>
    <ul class="group" id="links"></ul>
  </div>
</section>
</div>

<footer id="foot"></footer>

<script>
/* ================= 只需要改这里 ================= */
const ALBUM  = "SOUNDS OF MENGMAOLONE";
const ARTIST = "SAISAKI";

/* name 是两种语言下显示的平台名 */
const LINKS = [
  { zh:"Spotify",     en:"Spotify",            url:"https://open.spotify.com/album/6oJDdWVqVP5EE7vnZRvyis", icon:"icons/spotify.png",    color:"#1ED760" },
  { zh:"网易云音乐",  en:"NetEase Cloud Music", url:"https://music.163.com/album?id=409064697", icon:"icons/netease.png",    color:"#E5393E" },
  { zh:"YouTube",     en:"YouTube",            url:"https://www.youtube.com/playlist?list=PLQh8j2LeFFAA", icon:"icons/youtube.png",    color:"#FF4B3E" },
  { zh:"汽水音乐",    en:"Soda Music",         url:"https://qishui.douyin.com/s/iXwjgM5Q/", icon:"icons/qishui.png",     color:"#3D7BFF" },
  { zh:"Apple Music", en:"Apple Music",        url:"https://music.apple.com/album/sounds-of-mengmaolone/6832990628", icon:"icons/applemusic.png", color:"#FA5C70" },
  { zh:"QQ 音乐",     en:"QQ Music",           url:"https://c6.y.qq.com/base/fcgi-bin/u?__=cegukIdjqWo2", icon:"icons/qqmusic.png",    color:"#31C27C" }
];

/* 文案：中文 / 英文 */
const TEXT = {
  zh: {
    status:"全新专辑 · 现已上线",
    cta:"立即收听",
    statement:"这是属于新时代的年轻人<br>再度敲响勐卯弄的回响",
    intro:"瑞丽江的水，流了 2000 多年。<br><br>它见过勐卯弄的王宫与繁花，也见过战火、离散，和快要被遗忘的文字。这张专辑，是我用傣语写给这片土地的歌。<br><br>我唱祖先的伤痕，也唱泼水节的笑声；唱田埂上的晨雾、寺院里的诵经，也唱爱过的人和碎过的心。我还唱给妈妈听：十一岁那年我想要的机甲，你一直记着。现在我的声音终于传到了很远的地方，你却再也听不见了。<br><br>有人等着看我跌倒，可我身体里流着傣家的血，停不下来。<br><br>这不是翻唱歌曲，是一个傣家孩子替勐卯弄重新开口。<br><strong>这是勐卯弄。</strong><br><br>非常感谢你支持实体专辑。",
    listenTitle:"选择平台收听",
    soon:"即将上线",
    alts:["专辑封面：落日下眺望佛塔与河流的背影","专辑背封：月夜下的勐卯与 12 首曲目列表"],
    slide:"第 {n} 张", pause:"暂停轮播", play:"播放轮播",
    rights:"保留所有权利。"
  },
  en: {
    status:"New album · Out now",
    cta:"Listen now",
    statement:"A new generation,<br>sounding the echoes of Mengmaolone once more",
    intro:"The Shweli River has flowed for more than 2,000 years.<br><br>It has seen the palaces and blossoms of Mengmaolone, and it has seen war, scattering, and a written script close to being forgotten. This album is my songs to this land, written in the Dai language.<br><br>I sing of my ancestors’ scars and of laughter at the Water-Splashing Festival; of morning mist over the paddy ridges and chanting in the temple; of the people I loved and the heart that broke. And I sing for my mom: the mecha toy I wanted when I was eleven, you always remembered. Now my voice has finally reached somewhere far away, and you can no longer hear it.<br><br>Some are waiting to watch me fall, but Dai blood runs in me, and I can’t stop.<br><br>This is not a cover album. It is a Dai kid giving Mengmaolone its voice again.<br><strong>This is Mengmaolone.</strong><br><br>Thank you so much for supporting the physical album.",
    listenTitle:"Choose your platform",
    soon:"Coming soon",
    alts:["Album cover: a figure watching the sun set over pagodas and a river","Back cover: Mengmao under a full moon, with the 12-song tracklist"],
    slide:"Image {n}", pause:"Pause slideshow", play:"Play slideshow",
    rights:"All rights reserved."
  }
};
/* =============================================== */

/* 中国大陆时区或简体中文系统 → 中文；其他 → 英文。
   手动切换后会记住；链接末尾加 #zh 或 #en 可强制语言。 */
function detectLang(){
  const h = location.hash.slice(1);
  if (h === "zh" || h === "en") return h;
  try { const s = localStorage.getItem("lang"); if (s === "zh" || s === "en") return s; } catch(e){}
  let tz = "";
  try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch(e){}
  if (["Asia/Shanghai","Asia/Chongqing","Asia/Chungking","Asia/Harbin","Asia/Urumqi","Asia/Kashgar","PRC"].includes(tz)) return "zh";
  const l = ((navigator.languages && navigator.languages[0]) || navigator.language || "").toLowerCase();
  if (l === "zh-cn" || l.startsWith("zh-hans")) return "zh";
  return "en";
}

const chev = '<svg class="chev" viewBox="0 0 8 13" fill="none" aria-hidden="true"><path d="M1.5 1.5 6.5 6.5 1.5 11.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function render(lang){
  const T = TEXT[lang];
  document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
  document.title = ALBUM + " · " + ARTIST;
  document.getElementById("album").textContent = ALBUM;
  document.getElementById("artist").textContent = ARTIST;
  document.querySelectorAll(".slide img").forEach((img, i) => { img.alt = T.alts[i] || ""; });
  Gallery.label(T);
  document.querySelectorAll("[data-t]").forEach(el => { el.innerHTML = T[el.dataset.t]; });
  document.getElementById("foot").textContent = "© " + new Date().getFullYear() + " " + ARTIST + ". " + T.rights;

  const ul = document.getElementById("links");
  ul.innerHTML = "";
  LINKS.forEach(l => {
    const li = document.createElement("li");
    const a = document.createElement("a");
    a.className = "row" + (l.url ? "" : " off");
    if (l.url) { a.href = l.url; a.target = "_blank"; a.rel = "noopener"; }
    a.innerHTML = '<div class="row-in"><i class="dot"></i><span class="name"></span><span class="hint"></span>' + chev + '</div>';
    const dot = a.querySelector(".dot");
    dot.style.background = l.color;
    a.querySelector(".name").textContent = l[lang];
    a.querySelector(".hint").textContent = l.url ? "" : T.soon;
    if (l.icon) {
      const img = new Image(); img.className = "icon"; img.alt = "";
      img.onload = () => dot.replaceWith(img); img.src = l.icon;
    }
    li.appendChild(a); ul.appendChild(li);
  });


  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
}

document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => {
  try { localStorage.setItem("lang", b.dataset.lang); } catch(e){}
  render(b.dataset.lang);
}));
window.addEventListener("hashchange", () => {
  const h = location.hash.slice(1);
  if (h === "zh" || h === "en") render(h);
});

/* 封面轮播：每 5 秒滑到下一张，可点圆点切换、可暂停、手机可左右滑 */
const Gallery = (() => {
  const DUR = 5000;
  const wrap = document.getElementById("gallery-wrap");
  const gallery = document.getElementById("gallery");
  const track = document.getElementById("track");
  const pipsBox = document.getElementById("pips");
  const pp = document.getElementById("pp");
  const n = track.children.length;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let i = 0, playing = !reduce, T = null;
  wrap.style.setProperty("--dur", DUR + "ms");
  if (!playing) wrap.classList.add("still");

  const pips = [];
  for (let k = 0; k < n; k++) {
    const b = document.createElement("button");
    b.type = "button"; b.className = "pip"; b.innerHTML = "<i></i>";
    b.addEventListener("click", () => { go(k); });
    b.firstChild.addEventListener("animationend", () => { if (playing && k === i) go((i + 1) % n); });
    pipsBox.appendChild(b); pips.push(b);
  }
  function go(k){
    i = k;
    track.style.transform = "translateX(" + (-100 * i) + "%)";
    pips.forEach((b, j) => {
      b.classList.remove("on");
      b.setAttribute("aria-current", String(j === i));
    });
    void pipsBox.offsetWidth;          // 重新开始进度条动画
    pips[i].classList.add("on");
  }
  function setPlaying(v){
    playing = v;
    wrap.classList.remove("still");
    wrap.classList.toggle("paused", !v);
    label();
  }
  function label(t){
    if (t) T = t; if (!T) return;
    pp.setAttribute("aria-label", playing ? T.pause : T.play);
    pips.forEach((b, j) => b.setAttribute("aria-label", T.slide.replace("{n}", j + 1)));
  }
  pp.addEventListener("click", () => {
    if (wrap.classList.contains("still")) { setPlaying(true); go(i); } else setPlaying(!playing);
  });
  document.addEventListener("visibilitychange", () => {
    if (!wrap.classList.contains("still")) wrap.classList.toggle("paused", document.hidden || !playing);
  });

  // 手机左右滑
  let x0 = null, y0 = null;
  gallery.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, {passive:true});
  gallery.addEventListener("touchend", e => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) go((i + (dx < 0 ? 1 : n - 1)) % n);
    x0 = null;
  }, {passive:true});

  go(0);
  return { label };
})();

render(detectLang());
</script>
</body>
</html>
